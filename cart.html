<!DOCTYPE html>
<html>
<head>
<title>Cart - Seetha Vastram</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
margin:0;
}

h1{
background:black;
color:#ff69b4;
padding:20px;
margin:0;
}

.cart{
background:#222;
width:400px;
margin:40px auto;
padding:20px;
border-radius:10px;
}

button{
background:#ff69b4;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>

</head>

<body>

<h1>Shopping Cart 🛒</h1>
<p id="cartCount">Items in Cart: 0</p>

<div class="cart">

<h2>Your Shopping Cart</h2>

<p>Your selected items will appear here.</p>
<div id="cartItems"></div>
<h3 id="totalPrice">Total: ₹0</h3>
<a href="shop.html">
<button>Continue Shopping</button>
</a>
 <button onclick="clearCart()">🗑️ Clear Cart</button>

</div>
<script>
let count = localStorage.getItem("cartCount") || 0;
document.getElementById("cartCount").innerHTML = "Items in Cart: " + count;
</script>
 <script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
  count = cart.length;

document.getElementById("cartCount").innerText = "Items in Cart: " + cart.length;

let cartBox = document.getElementById("cartItems");

if (cart.length > 0) {
 let total = 0;
    cartBox.innerHTML = "";
    cart.forEach(function(item) {
     let price = Number(item.split("₹")[1]);
     total += price;
      cartBox.innerHTML += `<p>📁 ${item} <button onclick="removeItem('${item}')">❌ Remove</button></p>`;
    });
 document.getElementById("totalPrice").innerText = "Total: ₹" + total;
}

function removeItem(item) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart = cart.filter(i => i !== item);

    localStorage.setItem("cart", JSON.stringify(cart));
    localStorage.setItem("cartCount", cart.length);

    location.reload();
}
function clearCart() {
    localStorage.removeItem("cart");
    localStorage.removeItem("cartCount");
    document.getElementById("cartCount").innerText = "Items in Cart: 0";
location.reload();
}
</script>
 
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Cart - Seetha Vastram</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
margin:0;
}

h1{
background:black;
color:#ff69b4;
padding:20px;
margin:0;
}

.cart{
background:#222;
width:400px;
margin:40px auto;
padding:20px;
border-radius:10px;
}

button{
background:#ff69b4;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>

</head>

<body>
<div style="background:#111;padding:15px;text-align:center;">
    <a href="shop.html" style="color:white;margin:20px;text-decoration:none;">Home</a>
    <a href="cart.html" style="color:white;margin:20px;text-decoration:none;">Cart</a>
    <a href="checkout.html" style="color:white;margin:20px;text-decoration:none;">Checkout</a>
    <a href="contact.html" style="color:white;margin:20px;text-decoration:none;">Contact</a>
</div>
<h1>Shopping Cart 🛒</h1>
<p id="cartCount">Items in Cart: 0</p>

<div class="cart">

<h2>Your Shopping Cart</h2>

<p>Your selected items will appear here.</p>
<div id="cartItems"></div>
<h3 id="totalPrice">Total: ₹0</h3>
<a href="checkout.html">
    <button>Proceed to Checkout</button>
</a>
 <button onclick="clearCart()">🗑️ Clear Cart</button>

</div>
<script>
let count = localStorage.getItem("cartCount") || 0;
document.getElementById("cartCount").innerHTML = "Items in Cart: " + count;
</script>
 <script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
  count = cart.length;

document.getElementById("cartCount").innerText = "Items in Cart: " + cart.length;

let cartBox = document.getElementById("cartItems");

if (cart.length > 0) {
 let total = 0;
    cartBox.innerHTML = "";
    cart.forEach(function(item) {
    total += Number(item.price);

    cartBox.innerHTML += `
        <div style="margin-bottom:20px;">
            <img src="${item.image}" width="120"><br>
            <b>${item.product}</b><br>
            ₹${item.price}<br>
            <button onclick="removeItem('${item.product}')">Remove</button>
        </div>
    `;
});
    
function removeItem(item) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart = cart.filter(i => i.product !== item);

    localStorage.setItem("cart", JSON.stringify(cart));
    localStorage.setItem("cartCount", cart.length);

    location.reload();
}
function clearCart() {
    localStorage.removeItem("cart");
    localStorage.removeItem("cartCount");
    document.getElementById("cartCount").innerText = "Items in Cart: 0";
location.reload();
}
</script>
 
</body>
</html>

    <!DOCTYPE html>
    <html>
    <head>
        <title>Checkout</title>
    </head>
    <body>
        <div style="background:#111;padding:15px;text-align:center;">
    <a href="shop.html" style="color:white;margin:20px;text-decoration:none;">Shop</a>
    <a href="collections.html">Collections</a>
    <a href="cart.html" style="color:white;margin:20px;text-decoration:none;">Cart</a>
    <a href="contact.html" style="color:white;margin:20px;text-decoration:none;">Contact</a>
</div>
        <h1>Checkout</h1>
    
       
    
        <input type="text" id="name" placeholder="Full Name"><br><br>
    
    <input type="tel" id="phone" placeholder="Mobile Number"><br><br>
    
    <textarea id="address" placeholder="Delivery Address"></textarea><br><br>
        <select id="payment">
        <option>Cash on Delivery</option>
        <option>UPI</option>
        <option>Credit/Debit Card</option>
    </select><br><br>
        <button onclick="placeOrder()">Place Order</button>
        <script>
            function placeOrder() {
        alert("🎉 Thank you! Your order has been placed successfully.");
        let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;
let payment = document.getElementById("payment").value;
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let message = "🛍️ *New Order - Seetha Vastram*%0A%0A";

cart.forEach(function(item) {
    message += "🧵 Product: " + item.product + "%0A";
    message += "💰 Price: ₹" + item.price + "%0A";
    message += "🖼️ Image: https://venki712.github.io/seetha-vastram/" + item.image + "%0A%0A";
});

message += "👤 Name: " + name + "%0A";
message += "📞 Phone: " + phone + "%0A";
message += "🏠 Address: " + address + "%0A";
message += "💳 Payment: " + payment;

localStorage.setItem("lastOrder", "Order ID: SV2026001 - Status: Confirmed");
localStorage.removeItem("cart");
localStorage.removeItem("cartCount");

window.open(
    "https://wa.me/919611572494?text=" + message,
    "_blank"
);

window.location.href = "success.html";

    }

        </script>
    </body>
    </html>

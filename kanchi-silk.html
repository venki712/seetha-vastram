<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kanchi Silk Sarees - Seetha Vastram</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
margin:0;
}

.nav{
background:#000;
padding:15px;
}

.nav a{
color:white;
text-decoration:none;
margin:20px;
}

.products{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
padding:30px;
}

.card{
background:#222;
padding:15px;
width:250px;
border-radius:10px;
}

.card img{
width:220px;
border-radius:8px;
}

button{
background:#ff69b4;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
<a href="shop.html">Home</a>
<a href="collections.html">Collections</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</div>

<h1>Kanchi Silk Sarees</h1>

<div class="products">

<div class="card">
<img src="1.png">
<h3>Kanchi Silk Saree</h3>
<p>₹6,999</p>
<button onclick="addToCart('Kanchi Silk Saree',6999,'1.png')">Add to Cart</button>
</div>

<div class="card">
<img src="4.png">
<h3>Premium Kanchi Silk</h3>
<p>₹8,499</p>
<button onclick="addToCart('Premium Kanchi Silk',8499,'4.png')">Add to Cart</button>
</div>

</div>

<script>
function addToCart(product,price,image){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

cart.push({
product:product,
price:price,
image:image
});

localStorage.setItem("cart",JSON.stringify(cart));
localStorage.setItem("cartCount",cart.length);

window.location.href="cart.html";
}
</script>

</body>
</html>

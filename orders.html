<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
</head>
<body style="font-family:Arial;text-align:center;">

<h1>📦 My Orders</h1>

<p id="orderText">No orders yet.</p>

<a href="shop.html">
    <button>Continue Shopping</button>
</a>
<script>
let order = localStorage.getItem("lastOrder");

if (order) {
    document.getElementById("orderText").innerHTML =
        "✅ " + order + "<br><br>Status: Confirmed";
}
@media screen and (max-width:768px){

.nav{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

.products,
.collections{
display:flex;
flex-direction:column;
align-items:center;
}

.card{
width:90%;
max-width:350px;
}

.card img{
width:100%;
height:auto;
}

button{
width:100%;
}

input{
width:90%!important;
}

h1{
font-size:32px;
}

h2{
font-size:24px;
}

}
</script>
</body>
</html>

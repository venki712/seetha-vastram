<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
    text-align:center;
}

.nav{
    background:#000;
    padding:15px;
}

.nav a{
    color:white;
    text-decoration:none;
    margin:15px;

}

h1{
    color:#ff69b4;
}

.products{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:30px;
}

.card{
    background:#222;
    padding:20px;
    width:250px;
    border-radius:10px;
}

button{
    background:#ff69b4;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#ff1493;
}
</style>

</head>

<body>

<div class="nav">
<a href="shop.html">Home</a>
<a href="collections.html">Collections</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</div>

<h1>✿ Seetha Vastram ✿</h1>
<p>Elegant Sarees for Every Occasion</p>
<h2 style="color:#ff69b4;">Shop by Collection</h2>

<div class="products">
<div class="products">

<div class="card">
    <img src="1.png" width="220">
    <h3>Kanchi Silk Sarees</h3>
    <button onclick="location.href='kanchi-silk.html'">
        View Collection
    </button>
</div>

<div class="card">
    <img src="mysore-silk1.png" width="220">
    <h3>Mysore Silk Sarees</h3>
    <button onclick="location.href='mysore-silk.html'">
        View Collection
    </button>
</div>

</div>


</div>

<script>

function addToCart(product, price, image) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        product: product,
        price: price,
        image: image
    });

    localStorage.setItem("cart", JSON.stringify(cart));
    localStorage.setItem("cartCount", cart.length);

    window.location.href = "cart.html";
}

function searchProducts(){

let input=document.getElementById("search").value.toLowerCase();

let cards=document.getElementsByClassName("card");

for(let i=0;i<cards.length;i++){

let title=cards[i].getElementsByTagName("h2")[0].innerText.toLowerCase();

if(title.includes(input)){
cards[i].style.display="block";
}
else{
cards[i].style.display="none";
}

}

}

</script>

</body>

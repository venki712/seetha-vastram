<!DOCTYPE html>
<html>
<head>
<title>Shop - Seetha Vastram</title>
<style>
body{
font-family:Arial;
background:#111;
color:white;
margin:0;
text-align:center;
}
h1{
background:black;
color:#ff69b4;
padding:20px;
margin:0;
}
.products{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:30px;
}
.card{
background:#222;
padding:20px;
width:250px;
border-radius:10px;
}
button{
background:#ff69b4;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>
<div style="background:#111;padding:15px;text-align:center;">
    <a href="shop.html" style="color:white;margin:20px;text-decoration:none;">Home</a>
    <a href="cart.html" style="color:white;margin:20px;text-decoration:none;">Cart</a>
    <a href="contact.html" style="color:white;margin:20px;text-decoration:none;">Contact</a>
<section class="hero">
    <div class="hero-box">
        <h1>✿ Welcome to Seetha Vastram ✿</h1>
        <p>Elegant Sarees for Every Occasion</p>
        <h2>✨ Flat 20% OFF on Selected Collections ✨</h2>
    </div>
</section>
<h1>Shop - Seetha Vastram</h1>
<input
type="text"
id="search"
placeholder="🔍 Search Sarees..."
onkeyup="searchProducts()"
style="width:60%;padding:12px;margin:20px;border-radius:8px;font-size:16px;">
<a href="cart.html">
    <button style="float:right; margin:20px;">🛒 Cart</button>
</a>

<div class="products">

<div class="card">
<img src="1.png" width="220">

<h2>Silk Saree</h2>
<p>₹6,750</p>
<a href="https://wa.me/919611572494?text=Hi%20Seetha%20Vastram!%20I%20want%20to%20buy%20the%20Royal%20Pink%20Silk%20Saree." target="_blank">
<a href="cart.html">
<button onclick="addToCart('Silk Saree',2499)">Add to Cart</button>
</a>
</a>
</div>

<div class="card">
<img src="2.png" width="220">

<h2>Banarasi Saree</h2>
<p>₹3,299</p>
<a href="https://wa.me/919611572494?text=Hi%20Seetha%20Vastram!%20I%20want%20to%20buy%20the%20Banarasi%20Saree." target="_blank">
<a href="cart.html">
<button onclick="addToCart('Banarasi Saree',3299)">Add to Cart</button>
</a>
</a>
</div>

<div class="card">
<img src="3.png" width="220">

<h2>Bridal Saree</h2>
<p>₹5,999</p>
<a href="https://wa.me/919611572494?text=Hi%20Seetha%20Vastram!%20I%20want%20to%20buy%20the%20Bridal%20Saree." target="_blank">
<a href="cart.html">
<button onclick="addToCart('Bridal Saree',5999)">Add to Cart</button>
</a>
</a>
</div>

</div>
<script>
function searchProducts() {
  let input = document.getElementById("searchBox").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let title = cards[i].getElementsByTagName("h2")[0].innerText.toLowerCase();

    if (title.includes(input)) {
      cards[i].style.display = "block";
    } else {
      cards[i].style.display = "none";
    }
  }
}
</script>
<script>
function addToCart(product, price) {
    let count = Number(localStorage.getItem("cartCount")) || 0;
    count++;
    localStorage.setItem("cartCount", count);

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push(product + " - ₹" + price);
    localStorage.setItem("cart", JSON.stringify(cart));

    alert(product + " added to cart!");
}
</script>
<script>
function searchProducts() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.getElementsByClassName("card");

    for (let i = 0; i < cards.length; i++) {
        let title = cards[i].getElementsByTagName("h2")[0].innerText.toLowerCase();

        if (title.includes(input)) {
            cards[i].style.display = "block";
        } else {
            cards[i].style.display = "none";
        }
    }
}
</script>   
</body>
</html>

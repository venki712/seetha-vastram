<!DOCTYPE html>
<html>
<head>
<title>Shop - Seetha Vastram</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
    text-align:center;
}

.nav{
    background:#000;
    padding:15px;
}

.nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
}

h1{
    color:#ff69b4;
}

.products{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:30px;
}

.card{
    background:#222;
    padding:20px;
    width:250px;
    border-radius:10px;
}

button{
    background:#ff69b4;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#ff1493;
}
</style>

</head>

<body>

<div class="nav">
<a href="shop.html">Home</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</div>

<h1>✿ Seetha Vastram ✿</h1>
<p>Elegant Sarees for Every Occasion</p>

<input
type="text"
id="search"
placeholder="Search Sarees..."
onkeyup="searchProducts()"
style="width:60%;padding:12px;border-radius:8px;font-size:16px;">

<div class="products">

<div class="card">
<img src="1.png" width="220">
<h2>Silk Saree</h2>
<p>₹6,750</p>
<button onclick="addToCart('Silk Saree',6750,'1.png')">
Add to Cart
</button>
</div>

<div class="card">
<img src="2.png" width="220">
<h2>Silk Saree</h2>
<p>₹6,750</p>
<button onclick="addToCart('Silk Saree',6750,'2.png')">
Add to Cart
</button>
</div>

<div class="card">
<img src="3.png" width="220">
<h2>Silk Saree</h2>
<p>₹6,750</p>
<button onclick="addToCart('Silk Saree',6750,'3.png')">
Add to Cart
</button>
</div>

</div>

<script>

function addToCart(product, price, image) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        product: product,
        price: price,
        image: image
    });

    localStorage.setItem("cart", JSON.stringify(cart));
    localStorage.setItem("cartCount", cart.length);

    window.location.href = "cart.html";
}

function searchProducts(){

let input=document.getElementById("search").value.toLowerCase();

let cards=document.getElementsByClassName("card");

for(let i=0;i<cards.length;i++){

let title=cards[i].getElementsByTagName("h2")[0].innerText.toLowerCase();

if(title.includes(input)){
cards[i].style.display="block";
}
else{
cards[i].style.display="none";
}

}

}

</script>

</body>
</html>
